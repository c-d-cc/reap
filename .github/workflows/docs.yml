name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'media/**'
      - 'README*.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      # `vite build` runs esbuild, which strips types without checking them, and
      # the root tsconfig includes `src/**` only — so until this step existed
      # nothing in the repository typechecked `docs/`. It is placed before the
      # build so a failure stops the deploy rather than shipping past it.
      #
      # What it buys, concretely: the five locale files are held in a
      # `Record<string, Translations>` where `Translations` is `typeof en`, so
      # renaming a key in en.ts and missing one of the other four is an error
      # here. Nothing in the repository checked that before this step existed.
      - name: Typecheck docs
        working-directory: docs
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build docs
        working-directory: docs
        run: npx vite build

      - name: Copy index.html to 404.html for SPA routing
        run: cp docs/dist/public/index.html docs/dist/public/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
