name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'media/**'
      - 'README*.md'
      - '.github/workflows/docs.yml'
      # The gate below lives outside docs/ and nothing else runs it — not
      # ci.yml, not release.yml. Without these two lines, editing the gate does
      # not run the gate, and a change to it would first execute whenever
      # someone happened to touch a documentation page.
      - 'scripts/check-docs-prerender.sh'
      - 'scripts/check-docs-prerender.mjs'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      # `vite build` runs esbuild, which strips types without checking them, and
      # the root tsconfig includes `src/**` only — so until this step existed
      # nothing in the repository typechecked `docs/`. It is placed before the
      # build so a failure stops the deploy rather than shipping past it.
      #
      # What it buys, concretely: the five locale files are held in a
      # `Record<string, Translations>` where `Translations` is `typeof en`, so
      # renaming a key in en.ts and missing one of the other four is an error
      # here. Nothing in the repository checked that before this step existed.
      - name: Typecheck docs
        working-directory: docs
        run: npx tsc --noEmit -p tsconfig.json

      # `npm run build`, not `npx vite build`. The build is three steps now —
      # the client bundle, an SSR bundle of `src/entry-server.tsx`, and the
      # prerender pass that renders all 23 routes in all 5 locales into
      # `dist/public/<route>/index.html`. Calling vite directly would run the
      # first of the three and deploy the shell, which is the state gen-096
      # exists to end.
      - name: Build docs
        working-directory: docs
        run: npm run build

      # Layer 1: the files landed, with the right contents. Placed before the
      # upload so a shell-only build stops the deploy instead of replacing a
      # working site with one. See the header of the script for what it does
      # not check — everything about the served site, which is layer 2
      # (scripts/check-docs-live.sh) and needs this deploy to have happened.
      - name: Check prerendered output
        run: bash scripts/check-docs-prerender.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
