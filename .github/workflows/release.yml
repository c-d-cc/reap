name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): npm mints a short-lived credential for this
    # exact repository and workflow instead of us holding a long-lived token.
    # A job-level block replaces the top-level one entirely, so contents: read
    # is restated here for the checkout.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org


      - run: npm ci

      # Gate the publish on documents matching package.json. v0.17.1 shipped
      # with no docs update because nothing checked; this runs before publish so
      # a mismatch stops the release instead of being noticed afterwards.
      - name: Verify docs match package version
        run: bash scripts/check-docs-version.sh

      # `reap.autoUpdateMinVersion` names a release on npm and is spent telling
      # users to upgrade. Nothing checked that it named a release that exists,
      # and the mistake is only possible in the direction nobody tests: raise a
      # floor, forget to publish, and the affected users are sent after a
      # version that was never released.
      # Here rather than in ci.yml because it needs the network, and a check that
      # intermittently reports SKIP on every push is one people stop reading.
      - name: Verify the version floors name published releases
        run: bash scripts/check-version-floors.sh

      # The gate's OpenCode half skips itself when the client is absent, and a
      # runner has no reason to have it. Installing it is what makes that half
      # actually run here rather than report SKIP.
      #
      # Deliberately unpinned: the question is whether the *current* OpenCode
      # accepts what REAP writes. If upstream changes its schema this goes red,
      # and that is the signal — gen-080 was exactly that failure, found by a
      # user after it shipped.
      - name: Install OpenCode (for the self-diagnosis gate)
        run: npm i -g opencode-ai

      # reap:carrier(self-diagnosis-covered-incidents)
      # Install the tarball we are about to publish and ask REAP whether the
      # result is healthy. #22 was only ever visible after installing, and so
      # was a resolver that resolved nothing: section 5 requires the index to
      # find a relationship the fixture is known to have, rather than asking
      # whether indexing ran. Both were reproduced against the broken state
      # before being claimed here.
      - name: Self-diagnosis
        run: bash scripts/check-self-diagnosis.sh

      - run: npm run build
      # Trusted publishing needs npm 11.5.1 or later and Node 22 ships npm 10,
      # so npm is upgraded here rather than at the top of the job. npm 12 blocks
      # install scripts for global installs by default, which changes what the
      # self-diagnosis gate above observes — it must run on the same npm CI uses,
      # or the release gate and CI stop testing the same thing.
      - run: npm i -g npm@latest

      # No token: the OIDC credential is exchanged at publish time.
      - run: npm publish --access public

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only this version's section. RELEASE_NOTES.md keeps every past release,
      # and body_path on the whole file published all of them — v0.17.6's release
      # carried the v0.17.0 notes and a setup section for a feature that no
      # longer exists.
      # The current release is always the first `## ` block; older ones follow
      # as `## vX.Y.Z`.
      - name: Extract this version's notes
        run: awk '/^## /{n++} n==1' RELEASE_NOTES.md > /tmp/release-body.md

      - name: Fail if the extracted notes are empty
        run: test -s /tmp/release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-body.md
          generate_release_notes: false
