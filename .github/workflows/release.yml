name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Gate the publish on documents matching package.json. v0.17.1 shipped
      # with no docs update because nothing checked; this runs before publish so
      # a mismatch stops the release instead of being noticed afterwards.
      - name: Verify docs match package version
        run: bash scripts/check-docs-version.sh

      # The gate's OpenCode half skips itself when the client is absent, and a
      # runner has no reason to have it. Installing it is what makes that half
      # actually run here rather than report SKIP.
      #
      # Deliberately unpinned: the question is whether the *current* OpenCode
      # accepts what REAP writes. If upstream changes its schema this goes red,
      # and that is the signal — gen-080 was exactly that failure, found by a
      # user after it shipped.
      - name: Install OpenCode (for the self-diagnosis gate)
        run: npm i -g opencode-ai

      # Install the tarball we are about to publish and ask REAP whether the
      # result is healthy. Catches what #22 and the gen-074 daemon packaging
      # defect had in common: both were only visible after installing.
      - name: Self-diagnosis
        run: bash scripts/check-self-diagnosis.sh

      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
