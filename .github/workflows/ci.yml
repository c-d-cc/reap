name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      # A fresh install must never report anything about itself. Unlike the docs
      # check (which is only meaningful at release time, since package.json
      # legitimately runs ahead of the docs mid-development), this holds at every
      # commit — so it runs here rather than only before publish.
      #
      # Tests are not run here: tests/ is a private submodule and the default
      # GITHUB_TOKEN cannot fetch it. Tracked separately.
      - name: Self-diagnosis
        run: bash scripts/check-self-diagnosis.sh
